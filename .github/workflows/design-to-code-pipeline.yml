name: Design-to-Code AI Pipeline

on:
  pull_request:
    branches:
      - 'design/**'
  workflow_dispatch:
    inputs:
      changed_files:
        description: 'Comma-separated list of changed spec files (optional for auto-trigger)'
        required: false
        type: string
      workspace_path:
        description: 'Path to the project workspace (optional, defaults to repository root)'
        required: false
        type: string
        default: '.'
      config_path:
        description: 'Path to configuration file (optional, defaults to pipeline.yml in workspace)'
        required: false
        type: string
      ollama_model:
        description: 'Ollama model to use for code generation'
        required: false
        type: string
        default: 'codellama:13b'

jobs:
  design-to-code:
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --name ollama
          --health-cmd /usr/bin/ollama serve
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Extract changed spec files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.changed_files }}" ]; then
            echo "Using manually provided changed files: ${{ inputs.changed_files }}"
            echo "changed_files=${{ inputs.changed_files }}" >> $GITHUB_OUTPUT
          else
            # Extract changed files from git diff
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            else
              BASE_SHA="HEAD~1"
            fi
            
            # Find changed spec files (.yaml, .yml, .md in design/ directory)
            CHANGED_FILES=$(git diff --name-only $BASE_SHA HEAD | grep -E 'design/.*\.(yaml|yml|md)$' || true)
            
            if [ -z "$CHANGED_FILES" ]; then
              echo "No spec files changed in this commit"
              echo "changed_files=" >> $GITHUB_OUTPUT
            else
              # Convert to comma-separated list
              CHANGED_FILES_CSV=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//')
              echo "Changed spec files: $CHANGED_FILES_CSV"
              echo "changed_files=$CHANGED_FILES_CSV" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Validate configuration file
        if: inputs.config_path != ''
        run: |
          CONFIG_PATH="${{ inputs.config_path }}"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "Error: Configuration file not found at $CONFIG_PATH"
            exit 1
          fi
          echo "Configuration file validated: $CONFIG_PATH"
      
      - name: Build project
        run: |
          ./gradlew build -x test
      
      - name: Pull Ollama model
        run: |
          docker exec ollama ollama pull ${{ inputs.ollama_model || 'codellama:13b' }}
      
      - name: Run Design-to-Code Pipeline
        if: steps.changed-files.outputs.changed_files != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKSPACE_PATH="${{ inputs.workspace_path || '.' }}"
          CHANGED_FILES="${{ steps.changed-files.outputs.changed_files }}"
          CONFIG_PATH="${{ inputs.config_path || '' }}"
          OLLAMA_MODEL="${{ inputs.ollama_model || 'codellama:13b' }}"
          
          echo "Running pipeline with:"
          echo "  Workspace: $WORKSPACE_PATH"
          echo "  Changed files: $CHANGED_FILES"
          echo "  Config path: $CONFIG_PATH"
          echo "  Ollama model: $OLLAMA_MODEL"
          
          if [ -n "$CONFIG_PATH" ]; then
            ./gradlew run --args="-c $CONFIG_PATH $CHANGED_FILES $WORKSPACE_PATH"
          else
            ./gradlew run --args="$CHANGED_FILES $WORKSPACE_PATH"
          fi
      
      - name: Upload generated code artifacts
        if: steps.changed-files.outputs.changed_files != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: |
            **/*.kt
            **/*.java
          retention-days: 7
      
      - name: Upload coverage reports
        if: steps.changed-files.outputs.changed_files != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/reports/kover/
            build/reports/jacoco/
          retention-days: 7
      
      - name: Post PR summary with artifact links
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.changed_files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const repo = context.repo;
            const artifactsUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            
            const comment = `## Design-to-Code Pipeline Results 🤖
            
            The design-to-code pipeline has completed successfully!
            
            ### 📦 Artifacts
            - [Generated Code](${artifactsUrl}) - Kotlin and Java files generated from design specs
            - [Coverage Reports](${artifactsUrl}) - Kover and JaCoCo coverage reports
            - [Test Results](${artifactsUrl}) - Test execution results (if available)
            
            ### 📊 Summary
            - **Workspace**: \`${{ inputs.workspace_path || '.' }}\`
            - **Changed Files**: \`${{ steps.changed-files.outputs.changed_files }}\`
            - **Ollama Model**: \`${{ inputs.ollama_model || 'codellama:13b' }}\`
            - **Config Path**: \`${{ inputs.config_path || 'default (pipeline.yml)' }}\`
            
            ---
            *Generated by Design-to-Code AI Pipeline*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: repo.owner,
              repo: repo.repo,
              body: comment
            });
      
      - name: Skip pipeline
        if: steps.changed-files.outputs.changed_files == ''
        run: |
          echo "No spec files changed, skipping pipeline execution"
  
  test-generated-code:
    needs: design-to-code
    if: needs.design-to-code.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Download generated code artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-code
      
      - name: Run tests on generated code
        run: |
          ./gradlew test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 7
