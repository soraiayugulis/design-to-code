name: Design-to-Code AI Pipeline

on:
  workflow_dispatch:
    inputs:
      changed_files:
        description: 'Comma-separated list of changed spec files'
        required: true
        type: string
      workspace_path:
        description: 'Path to the project workspace'
        required: true
        type: string
      ollama_model:
        description: 'Ollama model to use for code generation'
        required: true
        type: string
        default: 'codellama:13b'

jobs:
  design-to-code:
    runs-on: ubuntu-latest
    container:
      image: design-to-code:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Design-to-Code Pipeline
        run: |
          java -jar /app/design-to-code.jar \
            "${{ inputs.changed_files }}" \
            "${{ inputs.workspace_path }}" \
            "${{ inputs.ollama_model }}"
