name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Run tests
        id: tests
        run: |
          ./gradlew test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 7
      
      - name: Run Detekt (lint)
        id: detekt
        if: always()
        run: |
          ./gradlew detekt
      
      - name: Upload Detekt results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-results
          path: build/reports/detekt/
          retention-days: 7
      
      - name: Check Detekt status
        if: always()
        run: |
          if [ -f build/reports/detekt/detekt.xml ]; then
            echo "Detekt report generated"
          else
            echo "Warning: Detekt report not found"
          fi
      
      - name: Run Kover (coverage)
        id: kover
        if: always()
        run: |
          ./gradlew koverXmlReport
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: build/reports/kover/
          retention-days: 7
      
      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = context.repo;
            const runUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- pr-validation-report -->';

            const icon = (outcome) =>
              outcome === 'success' ? '✅' : outcome === 'skipped' ? '⏭️' : '❌';

            const outcomes = {
              tests: '${{ steps.tests.outcome }}',
              detekt: '${{ steps.detekt.outcome }}',
              kover: '${{ steps.kover.outcome }}',
            };

            // --- Coverage (Kover XML, JaCoCo format) ---
            let coverage = null;
            try {
              const xml = fs.readFileSync('build/reports/kover/report.xml', 'utf8');
              const m = [...xml.matchAll(/<counter type="LINE" missed="(\d+)" covered="(\d+)"\s*\/>/g)];
              if (m.length) {
                const [, missed, covered] = m[m.length - 1].map(Number);
                const total = missed + covered;
                if (total) coverage = { pct: (covered / total * 100).toFixed(1), covered, total };
              }
            } catch (_) {}

            // --- Tests (JUnit XML) ---
            let tests = null;
            try {
              const dir = 'build/test-results/test';
              const acc = { tests: 0, failures: 0, errors: 0, skipped: 0 };
              for (const f of fs.readdirSync(dir).filter((f) => f.endsWith('.xml'))) {
                const head = fs.readFileSync(path.join(dir, f), 'utf8').match(/<testsuite\b[^>]*>/);
                if (!head) continue;
                for (const k of Object.keys(acc)) {
                  const r = head[0].match(new RegExp(`${k}="(\\d+)"`));
                  if (r) acc[k] += Number(r[1]);
                }
              }
              tests = acc;
            } catch (_) {}

            // --- Detekt issues ---
            let detektIssues = null;
            try {
              const xml = fs.readFileSync('build/reports/detekt/detekt.xml', 'utf8');
              detektIssues = (xml.match(/<error\b/g) || []).length;
            } catch (_) {}

            const passedTests = tests ? tests.tests - tests.failures - tests.errors - tests.skipped : null;
            const testDetails = tests
              ? `${passedTests} passed, ${tests.failures + tests.errors} failed, ${tests.skipped} skipped`
              : '—';
            const detektDetails = detektIssues === null ? '—' : `${detektIssues} issue(s)`;

            // Coverage gate: alert when below the 80% threshold.
            const COVERAGE_THRESHOLD = 80;
            const coverageBelow = coverage ? Number(coverage.pct) < COVERAGE_THRESHOLD : false;
            const coverageDetails = coverage
              ? `${coverage.pct}% lines (threshold ${COVERAGE_THRESHOLD}%)`
              : '—';
            const coverageIcon =
              outcomes.kover !== 'success' ? '❌' : !coverage ? '⚠️' : coverageBelow ? '⚠️' : '✅';

            const allGreen =
              Object.values(outcomes).every((o) => o === 'success') && !coverageBelow;
            const title = allGreen ? 'PR Validation Passed ✅' : 'PR Validation Failed ❌';

            const body = [
              marker,
              `## ${title}`,
              '',
              '| Check | Status | Details |',
              '| --- | :---: | --- |',
              `| Tests | ${icon(outcomes.tests)} | ${testDetails} |`,
              `| Detekt | ${icon(outcomes.detekt)} | ${detektDetails} |`,
              `| Coverage | ${coverageIcon} | ${coverageDetails} |`,
              '',
              `**Branch:** \`${{ github.head_ref }}\` · **Commit:** \`${context.payload.pull_request.head.sha.slice(0, 7)}\``,
              '',
              `🔗 [View full logs & download artifacts](${runUrl})`,
              '',
              '<sub>Generated by PR Validation CI</sub>',
            ].join('\n');

            // Delete all bot comments to ensure only one report exists.
            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments) {
              if (comment.user.type === 'Bot') {
                await github.rest.issues.deleteComment({
                  owner: repo.owner,
                  repo: repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Create a fresh comment with the report.
            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: context.issue.number,
              body,
            });
