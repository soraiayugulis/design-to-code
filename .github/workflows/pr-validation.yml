name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Run tests
        run: |
          ./gradlew test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 7
      
      - name: Run Detekt (lint)
        run: |
          ./gradlew detekt
      
      - name: Upload Detekt results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-results
          path: build/reports/detekt/
          retention-days: 7
      
      - name: Check Detekt status
        if: always()
        run: |
          if [ -f build/reports/detekt/detekt.xml ]; then
            echo "Detekt report generated"
          else
            echo "Warning: Detekt report not found"
          fi
      
      - name: Run Kover (coverage)
        run: |
          ./gradlew koverXmlReport
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: build/reports/kover/
          retention-days: 7
      
      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const repo = context.repo;
            const artifactsUrl = `https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId}`;
            
            const comment = `## PR Validation Results ✅
            
            ### 📦 Artifacts
            - [Test Results](${artifactsUrl}) - Unit test execution results
            - [Detekt Results](${artifactsUrl}) - Static code analysis
            - [Coverage Reports](${artifactsUrl}) - Code coverage reports
            
            ### 📊 Summary
            - **Branch**: \`${{ github.head_ref }}\`
            - **Commit**: \`${{ github.event.pull_request.head.sha }}\`
            
            ---
            *Generated by PR Validation CI*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: repo.owner,
              repo: repo.repo,
              body: comment
            });
